apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: customer-service-ingress-dev
  namespace: development
  annotations:
    # instruct AWS Load Balancer Controller to handle this Ingress
    kubernetes.io/ingress.class: "alb"
    # ALB specific options - internal ALB (change to internet-facing if needed)
    alb.ingress.kubernetes.io/scheme: "internal"
    # use IP targets (recommended for EKS with pod target mode / IP mode)
    alb.ingress.kubernetes.io/target-type: "ip"
    # target group protocol (HTTP to pods on 8080)
    alb.ingress.kubernetes.io/target-group-protocol: "HTTP"
    # health check path - adjust to your app health endpoint if you have one
    alb.ingress.kubernetes.io/healthcheck-path: "/actuator/health"
    alb.ingress.kubernetes.io/healthcheck-port: "traffic-port"
    # optionally tune health check interval/timeout thresholds
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "10"
spec:
  ingressClassName: alb
  # no host specified here so this Ingress will accept requests regardless of Host header
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: customer-service
                port:
                  number: 80

---
# Production Ingress (internet-facing ALB + TLS via cert-manager)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: customer-service-ingress-prod
  namespace: production
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
    alb.ingress.kubernetes.io/target-group-protocol: "HTTP"
    # request ALB to listen on both ports
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    # cert-manager hint to provision a TLS certificate (adjust cluster-issuer name)
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # health check path - ensure your application exposes an appropriate endpoint
    alb.ingress.kubernetes.io/healthcheck-path: "/actuator/health"
    alb.ingress.kubernetes.io/healthcheck-port: "traffic-port"
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "10"
spec:
  ingressClassName: alb
  tls:
    - hosts:
        - api.customer.prod.seudominio.com
      secretName: customer-service-tls
  rules:
    - host: api.customer.prod.seudominio.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: customer-service
                port:
                  number: 80
